name: Database Weekly Backup

on:
  schedule:
    # Berjalan tiap hari Minggu pukul 02:00 UTC (09:00 WIB)
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  backup:
    name: Dump PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Eksekusi pg_dump
        run: |
          mkdir -p backup
          FILE_NAME="backup/tuntas_backup_$(date +'%Y%m%d_%H%M%S').sql.gz"
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" --clean --if-exists --no-owner --no-privileges | gzip > "$FILE_NAME"
          echo "BACKUP_FILE=$FILE_NAME" >> $GITHUB_ENV

      - name: Unggah Artefak Backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
